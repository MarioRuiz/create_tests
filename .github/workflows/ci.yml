name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec spec/create_tests/ --format documentation

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.ruby-version == '3.4'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          mkdir -p .github/badges
          ruby <<'RUBY'
          require "json"

          line = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line").to_f
          message = format("%.2f%%", line)
          color =
            if line >= 90 then "brightgreen"
            elsif line >= 80 then "green"
            elsif line >= 70 then "yellow"
            else "red"
            end

          badge = {
            "schemaVersion" => 1,
            "label" => "coverage",
            "message" => message,
            "color" => color
          }
          File.write(".github/badges/coverage.json", JSON.pretty_generate(badge) + "\n")
          RUBY

          git add .github/badges/coverage.json
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged"
            exit 0
          fi
          git commit -m "Update coverage badge"
          git push origin HEAD:master
